<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ead6" media="(prefers-color-scheme: light)" data-default="#f3ead6" />
    <meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)" data-default="#1d1a17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ludus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Ludus — learn to read and write Roman numerals through bite-sized lessons and quizzes." />
    <title>Ludus — Learn Roman Numerals</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Apply a chosen light/dark theme before first paint, so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('ludus.save.v1')).settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
